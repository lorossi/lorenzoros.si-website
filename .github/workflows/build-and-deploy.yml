name: Build and Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - "public_html/**"
      - "python_scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-and-deploy.yml"
  schedule:
    - cron: "15 2 * * 0"
  workflow_dispatch: # Allows manual triggering

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Ruff
        run: |
          uv run ruff format --check python_scripts
          uv run ruff check python_scripts

      - name: ty
        run: uv run ty check python_scripts

  build-and-deploy:
    needs: lint
    runs-on: ubuntu-latest
    environment: deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Build and deploy website
        # every string setting can be overridden by a <SECTION>_<KEY> variable
        run: uv run --no-dev python python_scripts/build.py --build --deploy --settings python_scripts/settings.example.toml
        env:
          SCRAPER_TOKEN: ${{ secrets.SCRAPER_TOKEN }}
          DEPLOYER_USERNAME: ${{ secrets.DEPLOYER_USERNAME }}
          DEPLOYER_PASSWORD: ${{ secrets.DEPLOYER_PASSWORD }}
          DEPLOYER_REMOTE_PATH: ${{ secrets.DEPLOYER_REMOTE_PATH }}
          DEPLOYER_KEY_CONTENT: ${{ secrets.DEPLOYER_KEY_CONTENT }}
          DEPLOYER_HOST_KEY: ${{ secrets.DEPLOYER_HOST_KEY }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            python_scripts/stats.json
            python_scripts/repos.json
            dist/
